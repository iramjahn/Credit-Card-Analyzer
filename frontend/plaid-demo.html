<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardOptimizer - Plaid Integration Demo</title>
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f0f0f0;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .transactions {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .transaction {
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .transaction-name {
            font-weight: 600;
            color: #333;
        }
        
        .transaction-amount {
            color: #e74c3c;
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .transaction-date {
            color: #666;
            font-size: 0.9em;
        }
        
        .transaction-category {
            display: inline-block;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 0.85em;
            margin-top: 5px;
        }
        
        .spending-summary {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .spending-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .spending-category {
            font-size: 0.9em;
            opacity: 0.9;
            text-transform: capitalize;
        }
        
        .spending-amount {
            font-size: 1.5em;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 CardOptimizer</h1>
        <p class="subtitle">Connect your bank account to track spending and get personalized card recommendations</p>

        <div id="authSection">
            <input id="email" type="email" placeholder="Email" autocomplete="username" />
            <input id="password" type="password" placeholder="Password (min 8 chars)" autocomplete="current-password" />
            <button id="authButton" onclick="signIn()">Sign in / Sign up</button>
        </div>

        <button id="connectButton" onclick="openPlaidLink()" style="display:none; margin-top:15px;">
            Connect Bank Account
        </button>

        <div id="status"></div>
        <div id="transactions"></div>
        <div id="spending"></div>
    </div>

    <script>
        // Configuration
        const API_URL = 'http://localhost:8000';

        let token = null;        // JWT bearer token from /auth
        let linkToken = null;
        let handler = null;

        // Status display helper
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
        }

        // Authenticated fetch helper — attaches the bearer token.
        async function api(path, options = {}) {
            const headers = Object.assign(
                { 'Content-Type': 'application/json' },
                options.headers || {},
                token ? { 'Authorization': `Bearer ${token}` } : {}
            );
            const res = await fetch(`${API_URL}${path}`, { ...options, headers });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const detail = data.detail ? JSON.stringify(data.detail) : res.statusText;
                throw new Error(detail);
            }
            return data;
        }

        // Sign in, falling back to sign up if the account doesn't exist yet.
        async function signIn() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) {
                showStatus('⚠️ Enter an email and password first.', 'info');
                return;
            }

            showStatus('🔄 Signing in...', 'info');
            try {
                let data;
                try {
                    data = await api('/auth/login', {
                        method: 'POST',
                        body: JSON.stringify({ email, password })
                    });
                } catch (loginErr) {
                    // No account yet (or bad creds) — try to register.
                    showStatus('🔄 Creating a new account...', 'info');
                    data = await api('/auth/signup', {
                        method: 'POST',
                        body: JSON.stringify({ email, password })
                    });
                }

                token = data.token;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('connectButton').style.display = 'block';
                showStatus(`✅ Signed in as ${data.user.email}. Initializing Plaid...`, 'success');
                await initPlaid();
            } catch (error) {
                showStatus(`❌ Sign-in failed: ${error.message}`, 'error');
            }
        }

        // Get a Plaid Link token from the backend (requires auth).
        async function initPlaid() {
            try {
                const data = await api('/plaid/create-link-token', { method: 'POST' });
                linkToken = data.link_token;
                showStatus('✅ Ready to connect! Click "Connect Bank Account".', 'success');
            } catch (error) {
                showStatus(`❌ Error initializing Plaid: ${error.message}. Is the API running on port 8000?`, 'error');
            }
        }

        // Open Plaid Link
        function openPlaidLink() {
            if (!linkToken) {
                showStatus('⚠️ Still initializing... Please wait.', 'info');
                return;
            }

            handler = Plaid.create({
                token: linkToken,
                onSuccess: async (public_token, metadata) => {
                    showStatus('🔄 Exchanging token...', 'info');
                    await exchangeToken(public_token, metadata);
                },
                onExit: (err, metadata) => {
                    if (err) {
                        showStatus(`❌ Error: ${err.display_message}`, 'error');
                    } else {
                        showStatus('Connection cancelled', 'info');
                    }
                },
                onEvent: (eventName, metadata) => {
                    console.log('Plaid Event:', eventName, metadata);
                }
            });

            handler.open();
        }

        // Exchange the public token, then load data.
        async function exchangeToken(publicToken, metadata) {
            try {
                await api('/plaid/exchange-token', {
                    method: 'POST',
                    body: JSON.stringify({
                        public_token: publicToken,
                        institution_name: metadata?.institution?.name || null
                    })
                });

                showStatus('✅ Connected! Fetching transactions...', 'success');
                await fetchTransactions();
                await fetchSpending();
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Fetch transactions (GET, authenticated)
        async function fetchTransactions() {
            try {
                const data = await api('/plaid/transactions', { method: 'GET' });
                displayTransactions(data.transactions);
            } catch (error) {
                showStatus(`❌ Error fetching transactions: ${error.message}`, 'error');
            }
        }

        // Display transactions
        function displayTransactions(transactions) {
            const container = document.getElementById('transactions');

            if (!transactions || transactions.length === 0) {
                container.innerHTML = '<div class="status info">No transactions found</div>';
                return;
            }

            let html = `<h3 style="margin-top: 20px; color: #333;">Recent Transactions (${transactions.length})</h3><div class="transactions">`;

            transactions.slice(0, 10).forEach(txn => {
                html += `
                    <div class="transaction">
                        <div class="transaction-name">${txn.name}</div>
                        <div class="transaction-amount">$${txn.amount.toFixed(2)}</div>
                        <div class="transaction-date">${txn.date}</div>
                        ${txn.category ? `<span class="transaction-category">${txn.category}</span>` : ''}
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // Fetch spending summary (GET, authenticated)
        async function fetchSpending() {
            try {
                const data = await api('/plaid/spending', { method: 'GET' });
                displaySpending(data.spending);
            } catch (error) {
                console.error('Error fetching spending:', error);
            }
        }

        // Display spending summary
        function displaySpending(spending) {
            const container = document.getElementById('spending');

            if (!spending || Object.keys(spending).length === 0) {
                return;
            }

            let html = '<h3 style="margin-top: 20px; color: #333;">Spending by Category</h3><div class="spending-summary">';

            for (const [category, amount] of Object.entries(spending)) {
                html += `
                    <div class="spending-card">
                        <div class="spending-category">${category}</div>
                        <div class="spending-amount">$${amount.toFixed(2)}</div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }
    </script>
</body>
</html>
